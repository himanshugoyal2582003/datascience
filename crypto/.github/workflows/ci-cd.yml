name: 🚀 Deploy CFI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '18'

jobs:
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest
    working-directory: backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pylint black
      
      - name: 🎨 Lint with pylint
        run: pylint app/ --disable=all --enable=E,F || true
      
      - name: 📐 Format check with black
        run: black --check app/ || true
      
      - name: 🧪 Run tests
        run: pytest tests/ -v --cov=app --cov-report=xml || true
      
      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: backend

  test-frontend:
    name: 🧪 Test Frontend
    runs-on: ubuntu-latest
    working-directory: frontend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 📦 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: 📥 Install dependencies
        run: npm ci
      
      - name: 🎨 Lint
        run: npm run lint || true
      
      - name: 🔨 Build
        run: npm run build
      
      - name: 🧪 Run tests
        run: npm run test || true

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install bandit safety
      
      - name: 🔍 Security audit with bandit
        run: bandit -r backend/app/ || true
      
      - name: 📦 Check for known vulnerabilities
        run: safety check || true
      
      - name: 📦 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: 🔍 npm audit
        run: cd frontend && npm audit --audit-level=moderate || true

  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security-scan]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 🔄 Deploy Backend to Render (Staging)
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }} || echo "Staging deployment skipped"
      
      - name: 🔄 Deploy Frontend to Netlify (Staging)
        run: |
          curl -X POST ${{ secrets.NETLIFY_BUILD_HOOK_STAGING }} || echo "Staging deployment skipped"

  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://cfiback.onrender.com
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 🔄 Deploy Backend to Render
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }} || echo "Production deployment skipped"
      
      - name: 🔄 Deploy Frontend to Netlify
        run: |
          curl -X POST ${{ secrets.NETLIFY_BUILD_HOOK }} || echo "Production deployment skipped"
      
      - name: ✅ Create Deployment
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'production',
              production_environment: true
            })

  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    if: always()
    needs: [test-backend, test-frontend]
    
    steps:
      - name: 📧 Notify on failure
        if: failure()
        run: echo "Build failed! Check GitHub Actions for details."
